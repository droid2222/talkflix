<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Talkflix helps you practice languages through social connection, tutors, paid language partners, coaching, and the Talkflix app.">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Talkflix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Talkflix</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111114;
      --red: #e50914;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app-loader {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: #ffffff;
    }

    .app-loader-inner {
      display: grid;
      justify-items: center;
      gap: 18px;
      padding: 24px;
    }

    .app-loader-logo {
      width: 118px;
      height: auto;
      display: block;
    }

    .app-loader-mark {
      width: 42px;
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
    }

    .app-loader-mark::before {
      content: "";
      display: block;
      width: 18px;
      height: 100%;
      border-radius: inherit;
      background: var(--red);
      animation: app-loader-slide 900ms ease-in-out infinite alternate;
    }

    @keyframes app-loader-slide {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(24px);
      }
    }
  </style>
</head>
<body>
  <div class="app-loader" aria-label="Loading Talkflix">
    <div class="app-loader-inner">
      <img class="app-loader-logo" src="images/talkflix-logo-transparent.png" alt="Talkflix">
      <div class="app-loader-mark" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    (function () {
      if (!('caches' in window)) return;
      caches.keys().then(function (keys) {
        keys.forEach(function (key) {
          if (key.indexOf('flutter-app-cache') !== -1 || key.indexOf('talkflix') !== -1) {
            caches.delete(key).catch(function () {});
          }
        });
      }).catch(function () {});
    }());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
